name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege: CI only needs to read repository contents.
permissions:
  contents: read

# Supersede in-flight runs for the same PR/branch to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stable job id/name "verify" is the required status check context.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test configurator logic
        run: pnpm test

      - name: Test product-watch rules
        run: pnpm product-watch:test

      - name: Test Copilot evaluation rules
        run: pnpm copilot-evaluation:test

      - name: Build and type-check
        run: pnpm build
