version: 2

updates:
  # Keep GitHub Actions pinned SHAs current with a bounded review load.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # JavaScript/TypeScript dependencies (pnpm resolves via the npm ecosystem).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
